[package]
name = "control-plane"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
argon2 = "0.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
crypto_box = { version = "0.9.1", features = ["seal"] }
sha2 = "0.10"
subtle = "2.6"
rand = "0.8"
base64 = "0.22"
zeroize = { version = "1.8", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
totp-rs = { version = "6.0", features = ["gen_secret", "otpauth", "zeroize"] }
thiserror = "2.0"

[lib]
name = "control_plane"
path = "src/lib.rs"

[[bin]]
name = "control-plane"
path = "src/main.rs"

[[bin]]
name = "keygen"
path = "src/bin/keygen.rs"

[[bin]]
name = "escrow_tool"
path = "src/bin/escrow_tool.rs"
