name: CI/CD & Multi-Platform Release (Windows, Linux, Android PWA)

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Run Cargo Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose
        continue-on-error: true

  build-windows:
    name: Build Windows Standalone (.exe & .zip)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Web Frontend (UI)
        shell: pwsh
        run: |
          cd ui
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build
          cd ..

      - name: Build Release Windows Executable
        shell: pwsh
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Package Windows Distribution Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows/OmniBill-Portable
          Copy-Item src-tauri/target/release/omnibill.exe dist/windows/OmniBill-Portable/OmniBill.exe
          Copy-Item -Recurse ui/dist dist/windows/OmniBill-Portable/ui_dist
          
          # Add single-click Windows starter launcher script
          Set-Content -Path dist/windows/OmniBill-Portable/Run-OmniBill.bat -Value "@echo off`r`necho Starting OmniBill POS...`r`nstart OmniBill.exe --serve 4000`r`ntimeout /t 2 >nul`r`nstart http://127.0.0.1:4000/`r`n"
          
          # Compress to zip for clean customer download
          Compress-Archive -Path dist/windows/OmniBill-Portable/* -DestinationPath dist/OmniBill-v1.0.0-windows-x64.zip -Force
          Copy-Item src-tauri/target/release/omnibill.exe dist/OmniBill.exe

      - name: Upload Windows Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/OmniBill-v1.0.0-windows-x64.zip
            dist/OmniBill.exe
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnibill-windows-x64
          path: dist/OmniBill-v1.0.0-windows-x64.zip

  build-linux:
    name: Build Linux Standalone (.tar.gz)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Web Frontend (UI)
        run: |
          cd ui
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build
          cd ..

      - name: Build Release Linux Binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Package Linux Bundle
        run: |
          mkdir -p dist/linux/omnibill-bundle
          cp src-tauri/target/release/omnibill dist/linux/omnibill-bundle/
          cp -r ui/dist dist/linux/omnibill-bundle/
          cat << 'EOF' > dist/linux/omnibill-bundle/run.sh
          #!/bin/bash
          ./omnibill --serve 4000 &
          sleep 1
          xdg-open http://127.0.0.1:4000/ 2>/dev/null || sensible-browser http://127.0.0.1:4000/
          EOF
          chmod +x dist/linux/omnibill-bundle/run.sh dist/linux/omnibill-bundle/omnibill
          tar -czf dist/OmniBill-v1.0.0-linux-x64.tar.gz -C dist/linux/omnibill-bundle .

      - name: Upload Linux Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/OmniBill-v1.0.0-linux-x64.tar.gz
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-android-pwa:
    name: Deploy Android & Mobile Web POS (PWA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build PWA Web App
        run: |
          cd ui
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build
          touch dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ui/dist
          publish_branch: gh-pages
          force_orphan: true
