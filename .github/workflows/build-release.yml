name: CI/CD & Multi-Platform Release (Windows, Linux, Android PWA)

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Run Cargo Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose
        continue-on-error: true

  build-windows:
    name: Build Windows Standalone (.exe & .zip)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Web Frontend (UI)
        shell: pwsh
        run: |
          cd ui
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build
          cd ..

      - name: Build Release Windows Executable
        shell: pwsh
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Package Windows Distribution Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows/OmniBill-Portable
          Copy-Item src-tauri/target/release/omnibill.exe dist/windows/OmniBill-Portable/OmniBill.exe
          Set-Content -Path dist/windows/OmniBill-Portable/README.txt -Value "OmniBill POS Desktop`r`n`r`nDouble-click OmniBill.exe to launch!`r`nYour web browser will automatically open to http://127.0.0.1:4000/`r`n"
          Compress-Archive -Path dist/windows/OmniBill-Portable/* -DestinationPath dist/OmniBill-windows-x64.zip -Force
          Copy-Item src-tauri/target/release/omnibill.exe dist/OmniBill.exe

      - name: Upload Windows Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/OmniBill-windows-x64.zip
            dist/OmniBill.exe
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnibill-windows-x64
          path: dist/OmniBill-windows-x64.zip

  build-linux:
    name: Build Linux Standalone (.tar.gz)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Web Frontend (UI)
        run: |
          cd ui
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build
          cd ..

      - name: Build Release Linux Binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Package Linux Bundle
        run: |
          mkdir -p dist/linux/omnibill-bundle
          cp src-tauri/target/release/omnibill dist/linux/omnibill-bundle/OmniBill
          chmod +x dist/linux/omnibill-bundle/OmniBill
          tar -czf dist/OmniBill-linux-x64.tar.gz -C dist/linux/omnibill-bundle .
          cp src-tauri/target/release/omnibill dist/OmniBill-linux

      - name: Upload Linux Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/OmniBill-linux-x64.tar.gz
            dist/OmniBill-linux
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-android-pwa:
    name: Deploy Customer POS & Super Admin Control Plane to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Customer POS (PWA)
        run: |
          cd ui
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build
          cd ..

      - name: Build Super Admin Control Plane
        run: |
          cd control-plane/web
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build
          cd ../..

      - name: Assemble Unified Web Distribution
        run: |
          mkdir -p site_dist/admin
          cp -r ui/dist/* site_dist/
          cp -r control-plane/web/dist/* site_dist/admin/
          touch site_dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site_dist
          publish_branch: gh-pages
          force_orphan: true
