name: CI/CD & Multi-Platform Release

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MAX_BUNDLE_SIZE_BYTES: 15728640 # 15 MB strict limit

jobs:
  test:
    name: Test & Audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux System Dependencies (Tauri/WebKit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Run Cargo Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose

      - name: Run NPM Test Suite
        run: npm test

      - name: Run Cargo Format Check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

  build-windows:
    name: Build Windows Standalone & MSI
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Build Release Binaries
        shell: pwsh
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Verify Windows Binary & Bundle Size (< 15MB)
        shell: pwsh
        run: |
          $maxBytes = [int64]$env:MAX_BUNDLE_SIZE_BYTES
          $releaseDir = "src-tauri/target/release"
          $artifacts = Get-ChildItem -Path $releaseDir -Filter "*.exe" -File
          
          if ($artifacts.Count -eq 0) {
            Write-Host "Warning: No .exe found directly in target/release, checking bundle directories..."
            $artifacts = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Include "*.exe", "*.msi" -File -ErrorAction SilentlyContinue
          }

          if ($artifacts.Count -eq 0) {
            Write-Host "Checking target root release artifacts..."
            $artifacts = Get-ChildItem -Path "target/release" -Include "*.exe", "*.msi" -File -ErrorAction SilentlyContinue
          }

          $passed = $true
          foreach ($item in $artifacts) {
            $sizeBytes = $item.Length
            $sizeMB = [math]::Round($sizeBytes / 1MB, 2)
            Write-Host "Artifact: $($item.FullName)"
            Write-Host "Size: $sizeMB MB ($sizeBytes bytes)"

            if ($sizeBytes -gt $maxBytes) {
              Write-Error "VIOLATION: Artifact '$($item.Name)' is $sizeMB MB ($sizeBytes bytes), exceeding the 15MB threshold!"
              $passed = $false
            } else {
              Write-Host "PASS: Artifact '$($item.Name)' is within the 15MB budget."
            }
          }

          if (-not $passed) {
            exit 1
          }

      - name: Prepare Windows Distribution Staging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows
          Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" -File | Copy-Item -Destination dist/windows/
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Include "*.exe", "*.msi" -File -ErrorAction SilentlyContinue | Copy-Item -Destination dist/windows/
          Get-ChildItem -Path dist/windows

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnibill-windows-x64
          path: dist/windows/*
          if-no-files-found: warn

  build-linux:
    name: Build Linux Release Bundle
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build Release Binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Prepare Linux Distribution Staging
        run: |
          mkdir -p dist/linux
          find src-tauri/target/release -maxdepth 1 -type f -executable -exec cp {} dist/linux/ \;
          ls -la dist/linux/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnibill-linux-x64
          path: dist/linux/*
          if-no-files-found: warn

  build-macos:
    name: Build macOS Release Bundle
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Build Release Binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Prepare macOS Distribution Staging
        run: |
          mkdir -p dist/macos
          find src-tauri/target/release -maxdepth 1 -type f -perm +111 -exec cp {} dist/macos/ \;
          ls -la dist/macos/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnibill-macos-arm64
          path: dist/macos/*
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Release Assets Directory
        run: mkdir -p release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: omnibill-windows-x64
          path: release-assets/windows

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: omnibill-linux-x64
          path: release-assets/linux

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: omnibill-macos-arm64
          path: release-assets/macos

      - name: Generate SHA256 Checksums
        run: |
          cd release-assets
          find . -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" -o -name "omnibill*" \) -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*
            release-assets/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
